<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지분 평가</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">EQUITY REVIEW</span>
      </div>
      <span id="period-label" class="period-tag"></span>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>지분 평가 및 조정</h1>
      <p>2주 단위로 각 구성원의 업무 성과를 평가하여 지분을 조정합니다. 1회 조정 한도는 인당 ±5%p이며, 지분 총합은 항상 100%로 유지됩니다.</p>
    </section>

    <!-- 현재 지분 -->
    <section class="card">
      <div class="card-head">
        <h2>현재 지분</h2>
      </div>
      <div id="equity-table" class="equity-table"></div>
    </section>

    <!-- 업무 기록 -->
    <section class="card">
      <div class="card-head">
        <h2>업무 기록</h2>
        <span class="card-note">이번 평가 기간</span>
      </div>
      <p class="hint">담당 업무의 성과를 구체적으로 작성합니다. 결과물, 수치, 진척도를 중심으로 기술할수록 평가가 정확해집니다.</p>
      <div id="logs" class="logs"></div>

      <div class="actions">
        <button id="evaluate-btn" class="btn btn-primary">평가 실행</button>
        <span id="eval-status" class="status"></span>
      </div>
    </section>

    <!-- 평가 결과 -->
    <section id="result-card" class="card hidden">
      <div class="card-head"><h2>평가 결과</h2></div>
      <div id="result"></div>
    </section>

    <!-- 지난 기록 -->
    <section class="card">
      <div class="card-head">
        <h2>지난 평가 기록</h2>
        <button id="reset-btn" class="btn btn-ghost">초기화</button>
      </div>
      <div id="history" class="history"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <span>Equity Review</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
